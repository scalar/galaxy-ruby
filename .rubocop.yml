# yaml-language-server: $schema=https://www.rubyschema.org/rubocop.json
---
# Explicitly disable pending cops for now. This is the default behaviour but
# this avoids a large warning every time we run it.
# Stop RuboCop nagging about rubocop-rake.
# Ensure that RuboCop validates according to the lowest version of Ruby that we support.
AllCops:
  Exclude:
    - "bin/*"
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

# Whether MFA is required or not should be left to the token configuration.
Gemspec/RequireMFA:
  Enabled: false

# Don't require this extra line break, it can be excessive.
Layout/EmptyLineAfterGuardClause:
  Enabled: false

# Don't leave complex assignment values hanging off to the right.
Layout/EndAlignment:
  EnforcedStyleAlignWith: variable

Layout/FirstArrayElementLineBreak:
  Enabled: true

Layout/FirstHashElementLineBreak:
  Enabled: true

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/FirstMethodParameterLineBreak:
  Enabled: true

# Set a reasonable line length; rely on other cops to correct long lines.
Layout/LineLength:
  AllowedPatterns:
    - "^\\s*#.*$"
    - ^require(_relative)?
    - "ScalarGalaxy::Internal::Type::BaseModel$"
    - "^\\s*[A-Z0-9_]+ = :"
    - "ScalarGalaxy::(Models|Resources|Test)::"
  Max: 110

Layout/MultilineArrayLineBreaks:
  Enabled: true

# Start the assignment on the same line variable is mentioned.
Layout/MultilineAssignmentLayout:
  EnforcedStyle: same_line

Layout/MultilineHashKeyLineBreaks:
  Enabled: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

# Prefer compact hash literals.
Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space
  Exclude:
    - "**/*.rbi"

Lint/BooleanSymbol:
  Enabled: false

# This option occasionally mangles identifier names
Lint/DeprecatedConstants:
  Exclude:
    - "**/*.rbi"

# We use pattern assertion in tests to ensure correctness.
Lint/DuplicateMatchPattern:
  Exclude:
    - "test/**/*"

# Fairly useful in tests for pattern assertions.
Lint/EmptyInPattern:
  Exclude:
    - "test/**/*"

Lint/MissingCopEnableDirective:
  Exclude:
    - "examples/**/*.rb"

Lint/MissingSuper:
  Exclude:
    - "**/*.rbi"

Lint/SymbolConversion:
  Exclude:
    - "**/*.rbi"

# Disabled for safety reasons, this option changes code semantics.
Lint/UnusedMethodArgument:
  AutoCorrect: false

# This option is prone to causing accidental bugs.
Lint/UselessAssignment:
  AutoCorrect: false
  Exclude:
    - "examples/**/*.rb"

Metrics/AbcSize:
  Enabled: false

# The `**/*.gemspec` entry restores a RuboCop default. RuboCop ships this cop excluding gemspecs —
# the `Gem::Specification.new` block is one declaration list, not logic, and it grows past the
# default 25 lines on the packaged file list alone — but naming `Exclude` here replaces that default
# rather than adding to it, which silently put the gemspec back in scope.
Metrics/BlockLength:
  AllowedPatterns:
    - assert_pattern
    - type_alias
    - define_sorbet_constant!
  Exclude:
    - "**/*.gemspec"
    - "**/*.rbi"

Metrics/ClassLength:
  Enabled: false

Metrics/CollectionLiteralLength:
  Exclude:
    - "test/**/*"

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

# Need to preserve block identifier for documentation.
Naming/BlockForwarding:
  Enabled: false

# Underscores are generally useful for disambiguation.
Naming/ClassAndModuleCamelCase:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Naming/PredicatePrefix:
  Exclude:
    - "**/*.rbi"

Naming/VariableNumber:
  Enabled: false

# Nothing wrong with inline private methods.
Style/AccessModifierDeclarations:
  Enabled: false

Style/AccessorGrouping:
  Exclude:
    - "**/*.rbi"

# Behaviour of alias_method is more predictable.
Style/Alias:
  EnforcedStyle: prefer_alias_method

# And/or have confusing precedence, avoid them.
Style/AndOr:
  EnforcedStyle: always

Style/ArgumentsForwarding:
  Enabled: false

Style/BisectedAttrAccessor:
  Exclude:
    - "**/*.rbi"

# We prefer nested modules in lib/, but are currently using compact style for tests.
Style/ClassAndModuleChildren:
  Exclude:
    - "test/**/*"

Style/CommentAnnotation:
  Enabled: false

# We should go back and add these docs, but ignore for now.
Style/Documentation:
  Enabled: false

# Allow explicit empty elses, for clarity.
Style/EmptyElse:
  Enabled: false

Style/EmptyMethod:
  Exclude:
    - "**/*.rbi"

# We commonly use ENV['KEY'], it's OK.
Style/FetchEnvVar:
  Enabled: false

# Just to be safe, ensure nobody is mutating our internal strings.
Style/FrozenStringLiteralComment:
  EnforcedStyle: always
  Exclude:
    - "**/*.rbi"

# Nothing wrong with clear if statements.
Style/IfUnlessModifier:
  Enabled: false

# Rubocop is pretty bad about mangling single line lambdas.
Style/Lambda:
  Enabled: false

# Prefer consistency in method calling syntax.
Style/MethodCallWithArgsParentheses:
  AllowedMethods:
    - raise
  Enabled: true
  Exclude:
    - "**/*.gemspec"

Style/MultilineBlockChain:
  Enabled: false

# Perfectly fine.
Style/MultipleComparison:
  Enabled: false

Style/MutableConstant:
  Exclude:
    - "**/*.rbi"

# Not all parameters should be named.
Style/NumberedParameters:
  Enabled: false

Style/NumberedParametersLimit:
  Max: 2

# Reasonable to use brackets for errors with long messages.
Style/RaiseArgs:
  Enabled: false

# Be explicit about `RuntimeError`s.
Style/RedundantException:
  Enabled: false

Style/RedundantInitialize:
  Exclude:
    - "**/*.rbi"

Style/RedundantParentheses:
  Exclude:
    - "**/*.rbi"

# Prefer slashes for regex literals.
Style/RegexpLiteral:
  EnforcedStyle: slashes

# Allow explicit ifs, especially for imperative use.
Style/SafeNavigation:
  Enabled: false

Style/SignalException:
  Exclude:
    - Rakefile
    - "**/*.rake"

# We use these sparingly, where we anticipate future branches for the
# inner conditional.
Style/SoleNestedConditional:
  Enabled: false

# Prefer double quotes so that interpolation can be easily added.
Style/StringLiterals:
  EnforcedStyle: double_quotes

# Match `Style/StringLiterals` above rather than RuboCop's single-quote default. The generator
# formats emitted Ruby with syntax_tree, which prints double quotes inside interpolations too, so
# the default would put every interpolated literal in this SDK permanently at odds with the
# formatter — `rake format:rb` would rewrite what `rake lint` had just accepted, and back again.
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# `percent` rather than `brackets`, because syntax_tree rewrites `[:a, :b]` to `%i[a b]` and offers
# no option not to. The generator writes the bracketed form; the formatter converts it; this makes
# the linter agree with the file that actually ships.
#
# The Rakefile is excluded because the formatter never runs over it: the generator's pass selects
# files by extension, and `Rakefile` has none. It therefore keeps the bracketed spelling, which
# reads better for the `:"lint:rubocop"` task names it is made of.
Style/SymbolArray:
  EnforcedStyle: percent
  Exclude:
    - Rakefile

# Disabled because its autocorrection produces Ruby that does not parse. A `case/in` clause whose
# pattern ends in an endless range needs a trailing `then` — without it the next line is swallowed
# into the range — and syntax_tree correctly emits one. This cop strips it back off, which silently
# breaks the file. Verified against RuboCop 1.89.0, the version `Gemfile.lock` pins: running
# `rake format` over a generated SDK with this cop enabled leaves `errors.rb` and `base_client.rb`
# failing `ruby -c`.
Style/MultilineInPatternThen:
  Enabled: false

# This option makes examples harder to read for ruby novices.
Style/SymbolProc:
  Exclude:
    - "examples/**/*.rb"
